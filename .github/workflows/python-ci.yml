
name: Python CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Code Linting
        run: |
          flake8 secure_app tests --count --show-source --statistics

      - name: Run Automated Tests
        run: |
          python -m pytest tests -v --junitxml=reports/test-results.xml --cov=secure_app --cov-report=term --cov-report=xml:reports/coverage.xml

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-test-reports
          path: |
            reports/test-results.xml
            reports/coverage.xml
          if-no-files-found: warn
